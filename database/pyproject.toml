[project]
name = "database"
version = "0.1.0"
description = "Models SQLAlchemy compartilhados, organizados por área de negócio — pensado pra virar um pacote instalável à parte (PyPI ou git) no futuro."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "advanced-alchemy>=1.11.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Os contratos de import do pacote (database não depende de core/modules, cada módulo só
# importa a própria área) ficam no `backend/api/pyproject.toml`: um `lint-imports` só,
# rodando com os três pacotes como root. Quando este pacote sair do workspace, eles vêm junto.
