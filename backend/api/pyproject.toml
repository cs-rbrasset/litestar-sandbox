[project]
name = "litestar-sandbox-api"
version = "0.1.0"
description = "API do litestar-sandbox — monólito modular (core + modules), flat, sem pacote wrapper."
readme = "README.md"
authors = [
    { name = "Claudio Silva", email = "cs@rbrasset.com.br" }
]
requires-python = ">=3.14"
dependencies = [
    "advanced-alchemy>=1.11.0",
    "aiosqlite>=0.22.1",
    "database",
    "httpx>=0.28.1",
    "litestar-autowire>=0.2.0",
    "litestar-security>=0.7.1",
    "litestar-vite>=0.32.0",
    "litestar[standard]>=2.24.0",
    "niquests>=3.16.0",
    "prefect>=3.9.0",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.11.0",
    "xhtml2pdf>=0.2.28",
]

[tool.uv.sources]
database = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ""
module-root = ""
namespace = true

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["."]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "A",        # flake8-builtins
    "C4",       # flake8-comprehensions
    "DTZ",      # flake8-datetimez (datetimes sem timezone)
    "T20",      # flake8-print
    "SIM",      # flake8-simplify
    "TC",       # flake8-type-checking
    "PTH",      # flake8-use-pathlib
    "RET",      # flake8-return
    "RUF",      # regras do próprio ruff
    "PL",       # pylint
    "PERF",     # perflint
    "S",        # flake8-bandit (segurança)
    "ASYNC",    # flake8-async
    "FAST",     # boas práticas p/ frameworks ASGI
]
ignore = [
    "E501",     # comprimento de linha fica a cargo do formatter
    "PLR0913",  # muitos argumentos (comum em handlers/DTOs)
    "PLR2004",  # magic numbers
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "PLR2004", "T20"]
# Litestar Controllers declaram path/dependencies/guards como atributos de classe por design
"**/controllers.py" = ["RUF012", "UP040"]
# Litestar dependencies com Type Alias
"**/deps.py" = ["UP040"]

[tool.ruff.lint.isort]
known-first-party = ["core", "modules"]

[tool.ruff.lint.flake8-type-checking]
# Litestar/msgspec/SQLAlchemy resolvem anotações em runtime — não mover p/ TYPE_CHECKING
runtime-evaluated-base-classes = [
    "advanced_alchemy.base.UUIDBase",
    "advanced_alchemy.base.UUIDAuditBase",
    "advanced_alchemy.base.BigIntBase",
    "advanced_alchemy.base.BigIntAuditBase",
    "sqlalchemy.orm.DeclarativeBase",
    "msgspec.Struct",
    "pydantic.BaseModel",
]
runtime-evaluated-decorators = [
    "litestar.get", "litestar.post", "litestar.put",
    "litestar.patch", "litestar.delete", "litestar.route",
    "prefect.flow", "prefect.task",
    "core.jobs.job",  # a porta de jobs resolve as anotações em runtime, igual ao prefect.flow
    "core.jobs.etapa",
]
exempt-modules = ["typing", "core.deps"] # aliases do core.deps são lidos pelo di do litestar em runtime

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.14"
python = ".venv"

[tool.ty.src]
include = [".", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
# Promove para erro checagens que vêm como warning por padrão
possibly-unresolved-reference = "error"
redundant-cast = "error"
unused-ignore-comment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
# `database` entra como root package (e não como externo) pra dar granularidade por área:
# como externo, o grimp só enxergaria o nome de topo e "cada módulo só importa a própria área"
# seria inexprimível. Um `lint-imports` só cobre os três pacotes.
root_packages = ["core", "modules", "database"]
# necessário pros contratos que proíbem pacote de terceiro (prefect, sqlalchemy, playwright...)
include_external_packages = true
# import sob `if TYPE_CHECKING` não existe em runtime: é isso que torna os contratos de pureza
# de `domain/` e `parsers/` uma afirmação sobre o que o código realmente carrega.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "core não depende de módulos"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["modules"]

# O pacote `database` é publicável à parte: a dependência é num sentido só.
[[tool.importlinter.contracts]]
name = "database não depende da API nem do framework"
type = "forbidden"
source_modules = ["database"]
forbidden_modules = ["core", "modules", "litestar", "prefect", "niquests", "httpx"]

# Porta de jobs: `core.jobs` é o único lugar do backend que fala com o orquestrador.
# allow_indirect_imports: modules -> core.jobs -> prefect é justamente o caminho permitido.
[[tool.importlinter.contracts]]
name = "nenhum módulo importa prefect (só core.jobs)"
type = "forbidden"
source_modules = ["modules"]
forbidden_modules = ["prefect"]
allow_indirect_imports = true

# Direção da integração: custodiante -> carteira/extrato, nunca o inverso.
[[tool.importlinter.contracts]]
name = "carteira e extrato não conhecem custodiante"
type = "forbidden"
source_modules = ["modules.carteira", "modules.extrato"]
forbidden_modules = ["modules.custodiante"]

[[tool.importlinter.contracts]]
name = "custodiante só acessa carteira.public e extrato.public"
type = "forbidden"
source_modules = ["modules.custodiante"]
forbidden_modules = ["modules.carteira", "modules.extrato"]
ignore_imports = [
    "modules.custodiante.** -> modules.carteira.public",
    "modules.custodiante.** -> modules.extrato.public",
]
allow_indirect_imports = true

# carteira e extrato são irmãos independentes: um não fala com o outro.
[[tool.importlinter.contracts]]
name = "carteira e extrato são independentes entre si"
type = "independence"
modules = ["modules.carteira", "modules.extrato"]

# Pureza: o canônico e os parsers não podem carregar banco, framework, rede nem navegador.
# É o que permite testá-los sem fixture e reprocessar um bruto sem subir infraestrutura.
# allow_indirect_imports: o que importa aqui é o import direto — o caminho legítimo
# parsers -> carteira.public é o que leva (indiretamente) ao resto.
[[tool.importlinter.contracts]]
name = "domínio e parsers são puros"
type = "forbidden"
source_modules = [
    "modules.carteira.domain",
    "modules.extrato.domain",
    "modules.custodiante.parsers",
]
forbidden_modules = [
    "sqlalchemy",
    "advanced_alchemy",
    "prefect",
    "litestar",
    "httpx",
    "niquests",
    "playwright",
    "paramiko",
    "database",
    "modules.custodiante.gateways",
]
allow_indirect_imports = true

# Cada módulo só importa a própria área de `database.models` — um contrato por área.
# allow_indirect_imports: um módulo chega a outra área indiretamente pelo `public.py` do dono,
# e isso é permitido; o que não pode é importar a área alheia direto.
[[tool.importlinter.contracts]]
name = "só ativos importa database.models.ativos"
type = "forbidden"
source_modules = [
    "modules.boletas",
    "modules.posicoes",
    "modules.notas",
    "modules.carteira",
    "modules.extrato",
    "modules.custodiante",
]
forbidden_modules = ["database.models.ativos"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "só boletas importa database.models.boletas"
type = "forbidden"
source_modules = [
    "modules.ativos",
    "modules.posicoes",
    "modules.notas",
    "modules.carteira",
    "modules.extrato",
    "modules.custodiante",
]
forbidden_modules = ["database.models.boletas"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "só posicoes importa database.models.posicoes"
type = "forbidden"
source_modules = [
    "modules.ativos",
    "modules.boletas",
    "modules.notas",
    "modules.carteira",
    "modules.extrato",
    "modules.custodiante",
]
forbidden_modules = ["database.models.posicoes"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "só notas importa database.models.notas"
type = "forbidden"
source_modules = [
    "modules.ativos",
    "modules.boletas",
    "modules.posicoes",
    "modules.carteira",
    "modules.extrato",
    "modules.custodiante",
]
forbidden_modules = ["database.models.notas"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "só carteira importa database.models.carteira"
type = "forbidden"
source_modules = [
    "modules.ativos",
    "modules.boletas",
    "modules.posicoes",
    "modules.notas",
    "modules.extrato",
    "modules.custodiante",
]
forbidden_modules = ["database.models.carteira"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "só extrato importa database.models.extrato"
type = "forbidden"
source_modules = [
    "modules.ativos",
    "modules.boletas",
    "modules.posicoes",
    "modules.notas",
    "modules.carteira",
    "modules.custodiante",
]
forbidden_modules = ["database.models.extrato"]
allow_indirect_imports = true

# custodiante não tem área no database: o bruto mora no object storage, e carteira/extrato
# guardam só uma referência opaca. Se um dia precisar de tabela, a área nasce junto do contrato.
[[tool.importlinter.contracts]]
name = "custodiante não tem tabela própria"
type = "forbidden"
source_modules = ["modules.custodiante"]
forbidden_modules = ["database"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "ativos não depende de boletas"
type = "forbidden"
source_modules = ["modules.ativos"]
forbidden_modules = ["modules.boletas"]

# Proíbe o pacote inteiro e libera só o public.py: um arquivo interno novo já nasce proibido.
# allow_indirect_imports: o public.py importa o service do próprio módulo para montar o
# provider, então boletas -> ativos.public -> ativos.services é um caminho legítimo.
[[tool.importlinter.contracts]]
name = "boletas só acessa ativos.public"
type = "forbidden"
source_modules = ["modules.boletas"]
forbidden_modules = ["modules.ativos"]
ignore_imports = ["modules.boletas.** -> modules.ativos.public"]
allow_indirect_imports = true

# posicoes consome o TradeSettled pelo contrato público do boletas; o instrument_id e o
# cetip_code chegam no evento, então não há motivo para conhecer o ativos.
[[tool.importlinter.contracts]]
name = "posicoes só acessa boletas.public"
type = "forbidden"
source_modules = ["modules.posicoes"]
forbidden_modules = ["modules.boletas", "modules.ativos"]
ignore_imports = ["modules.posicoes.** -> modules.boletas.public"]
allow_indirect_imports = true

# posicoes é a ponta do fluxo: ninguém depende dele, só o app.py, que monta tudo.
[[tool.importlinter.contracts]]
name = "nenhum módulo depende de posicoes"
type = "forbidden"
source_modules = [
    "modules.ativos",
    "modules.boletas",
    "modules.carteira",
    "modules.extrato",
    "modules.custodiante",
]
forbidden_modules = ["modules.posicoes"]

# notas é independente: um notepad por pessoa, sem relação com ativos/boletas/posicoes.
[[tool.importlinter.contracts]]
name = "notas não depende de outros módulos"
type = "forbidden"
source_modules = ["modules.notas"]
forbidden_modules = [
    "modules.ativos",
    "modules.boletas",
    "modules.posicoes",
    "modules.carteira",
    "modules.extrato",
    "modules.custodiante",
]

[[tool.importlinter.contracts]]
name = "nenhum módulo depende de notas"
type = "forbidden"
source_modules = [
    "modules.ativos",
    "modules.boletas",
    "modules.posicoes",
    "modules.carteira",
    "modules.extrato",
    "modules.custodiante",
]
forbidden_modules = ["modules.notas"]
